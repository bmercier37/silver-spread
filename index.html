<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Silver Monitor</title>

<!-- ✅ ICÔNE IPHONE -->
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background:#0b0f14;
  color:#eaeaea;
  text-align:center;
  padding:20px;
}
.card {
  background:#161b22;
  border-radius:12px;
  padding:15px;
  margin:10px auto;
  max-width:360px;
}
.value { font-size:1.6em; font-weight:bold; }
.small { color:#9aa4ad; font-size:0.9em; }
.alert { color:#ffb300; font-weight:bold; }
.danger { color:#ff5252; font-weight:bold; }
canvas { max-width:100%; margin-top:15px; }
</style>
</head>

<body>

<h2>🥈 Silver Market Monitor</h2>

<div class="card">
  <div>NY / Londres</div>
  <div id="ny" class="value">--</div>
</div>

<div class="card">
  <div>Shanghai (estimé)</div>
  <div id="sh" class="value">--</div>
</div>

<div class="card">
  <div>Spread</div>
  <div id="spread" class="value">--</div>
</div>

<div class="card">
  <div>Ratio Or / Argent</div>
  <div id="ratio" class="value">--</div>
</div>

<div class="card">
  <div>Structure</div>
  <div id="structure" class="value">--</div>
</div>

<div class="card">
  <div>Short Squeeze Risk</div>
  <div id="squeeze" class="value">--</div>
</div>

<canvas id="chart" height="120"></canvas>

<script>
const API_URL = "https://api.metals.dev/v1/latest";
const UPDATE_INTERVAL = 7 * 60 * 60 * 1000; // 7 heures
const SH_PREMIUM = 1.05;

function now(){ return Date.now(); }

function shouldFetch(){
  const last = localStorage.getItem("lastFetch");
  return !last || now() - last > UPDATE_INTERVAL;
}

function save(s,g){
  localStorage.setItem("silver",s);
  localStorage.setItem("gold",g);
  localStorage.setItem("lastFetch",now());
}

function load(){
  const s = localStorage.getItem("silver");
  const g = localStorage.getItem("gold");
  return s && g ? {s:+s,g:+g} : null;
}

function updateUI(silver,gold){
  const sh = silver * SH_PREMIUM;
  const spread = sh - silver;
  const spreadPct = spread / silver * 100;
  const ratio = gold / silver;

  document.getElementById("ny").innerText = silver.toFixed(2)+" $";
  document.getElementById("sh").innerText = sh.toFixed(2)+" $";
  document.getElementById("spread").innerText =
    spread.toFixed(2)+" $ ("+spreadPct.toFixed(2)+"%)";
  document.getElementById("ratio").innerText = ratio.toFixed(1);
  document.getElementById("structure").innerText =
    spreadPct>0 ? "Backwardation" : "Contango";

  /* 🔥 SHORT SQUEEZE SCORE */
  let score = 0;
  if (spreadPct > 3) score += 1;
  if (spreadPct > 5) score += 1;
  if (ratio > 90) score += 1;

  let label = "Low";
  let cls = "alert";
  if (score >= 2) { label="Elevated"; cls="alert"; }
  if (score >= 3) { label="⚠️ HIGH"; cls="danger"; }

  const sq = document.getElementById("squeeze");
  sq.innerText = label + " ("+score+"/3)";
  sq.className = "value "+cls;

  let hist = JSON.parse(localStorage.getItem("hist")||"[]");
  hist.push(spreadPct);
  if(hist.length>30)hist.shift();
  localStorage.setItem("hist",JSON.stringify(hist));
  draw(hist);
}

async function fetchData(){
  try{
    const r = await fetch(API_URL);
    const d = await r.json();
    save(d.metals.silver,d.metals.gold);
    updateUI(d.metals.silver,d.metals.gold);
  }catch{
    const l = load();
    if(l) updateUI(l.s,l.g);
  }
}

function draw(data){
  const c = document.getElementById("chart");
  const x = c.getContext("2d");
  x.clearRect(0,0,c.width,c.height);
  if(data.length<2)return;
  const max=Math.max(...data),min=Math.min(...data);
  x.beginPath(); x.strokeStyle="#4da3ff";
  data.forEach((v,i)=>{
    const px=i*(c.width/(data.length-1));
    const py=c.height-(v-min)/(max-min||1)*c.height;
    i?x.lineTo(px,py):x.moveTo(px,py);
  });
  x.stroke();
}

(function(){
  const l = load();
  if(l) updateUI(l.s,l.g);
  if(shouldFetch()) fetchData();
})();
</script>

</body>
</html>
