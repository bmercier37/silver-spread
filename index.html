<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silver Spread Monitor</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
  
<style>
body {
  font-family: Arial, sans-serif;
  background:#0e0e0e;
  color:#fff;
  padding:20px;
}
.card {
  background:#1c1c1c;
  padding:15px;
  margin-bottom:15px;
  border-radius:8px;
}
.value { font-size:1.6em; }
canvas { width:100%; height:150px; }
</style>
</head>

<body>

<h2>Silver Spread Monitor</h2>

<div class="card">
  <div>New York (COMEX)</div>
  <div class="value" id="ny">--</div>
</div>

<div class="card">
  <div>Londres (LBMA)</div>
  <div class="value" id="ldn">--</div>
</div>

<div class="card">
  <div>Shanghai (proxy physique)</div>
  <div class="value" id="sh">--</div>
</div>

<div class="card">
  <div>Prime Shanghai vs COMEX</div>
  <div class="value" id="spread">--</div>
</div>

<div class="card">
  <div>Structure du marché</div>
  <div class="value" id="structure">--</div>
</div>

<div class="card">
  <div>Ratio Or / Argent</div>
  <div class="value" id="ratio">--</div>
</div>

<div class="card">
  <div>Évolution de la prime (%)</div>
  <canvas id="chart" width="300" height="150"></canvas>
</div>

<div class="card">
  <div>Indicateur de stress</div>
  <div class="value" id="stress">--</div>
</div>

<script>
const API_KEY = "TA_CLE_API_ICI";

/* --------- GRAPH --------- */
function drawChart(data) {
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (data.length < 2) return;

  const max = Math.max(...data, 5);
  const min = Math.min(...data, 0);

  ctx.beginPath();
  data.forEach((v, i) => {
    const x = (i / (data.length - 1)) * canvas.width;
    const y = canvas.height - ((v - min) / (max - min)) * canvas.height;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });

  ctx.strokeStyle = "#4caf50";
  ctx.lineWidth = 2;
  ctx.stroke();
}

/* --------- LOAD DATA --------- */
async function load() {

  /* Fallback local */
  const lastSilver = localStorage.getItem("lastSilver");
  const lastGold = localStorage.getItem("lastGold");

  if (lastSilver && lastGold) {
    document.getElementById("ny").innerText = Number(lastSilver).toFixed(2)+" $";
    document.getElementById("ldn").innerText = Number(lastSilver).toFixed(2)+" $";
    document.getElementById("sh").innerText = (lastSilver * 1.05).toFixed(2)+" $";
    document.getElementById("ratio").innerText =
      (lastGold / lastSilver).toFixed(1);
  }

  try {
    const silverRes = await fetch("https://www.goldapi.io/api/XAG/USD", {
      headers: { "x-access-token": API_KEY }
    });
    const goldRes = await fetch("https://www.goldapi.io/api/XAU/USD", {
      headers: { "x-access-token": API_KEY }
    });

    if (!silverRes.ok || !goldRes.ok) throw new Error("API limit");

    const silver = await silverRes.json();
    const gold = await goldRes.json();

    const silverNY = silver.price;
    const silverSH = silverNY * 1.05;

    document.getElementById("ny").innerText = silverNY.toFixed(2)+" $";
    document.getElementById("ldn").innerText = silverNY.toFixed(2)+" $";
    document.getElementById("sh").innerText = silverSH.toFixed(2)+" $";

    const spreadPct = ((silverSH - silverNY) / silverNY) * 100;
    document.getElementById("spread").innerText =
      (silverSH - silverNY).toFixed(2)+" $ ("+spreadPct.toFixed(2)+" %)";

    document.getElementById("structure").innerText =
      silverSH > silverNY ? "Backwardation (tension physique)" : "Contango";

    document.getElementById("ratio").innerText =
      (gold.price / silverNY).toFixed(1);

    document.getElementById("stress").innerText =
      spreadPct > 5 ? "⚠️ RISQUE DE SHORT SQUEEZE" : "Situation normale";

    /* Stockage local */
    localStorage.setItem("lastSilver", silverNY);
    localStorage.setItem("lastGold", gold.price);

    /* Historique graphique */
    let hist = JSON.parse(localStorage.getItem("primeHist")) || [];
    hist.push(spreadPct);
    if (hist.length > 30) hist.shift();
    localStorage.setItem("primeHist", JSON.stringify(hist));

    drawChart(hist);

  } catch (e) {
    console.warn("API indisponible – valeurs conservées");
  }
}

load();
setInterval(load, 1800000); // 30 minutes refresh
</script>

</body>
</html>
